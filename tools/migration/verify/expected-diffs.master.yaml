# Allowlist of accepted MkDocs-vs-Docusaurus content differences (see compare.py).
#
# Every listed rule must explain at least one difference, otherwise compare.py fails
# (so the list cannot go stale). Built-in rule names:
#   placeholder-visible, ol-start, nested-list, list-not-paragraph, admonition-title-markup,
#   deprecated-banner-page-removed, gfm-autolink-literal, onclick-card-link,
#   list-restructure-text-preserved (always pinned to pages), admonition-type-map
# Built-in entries: `- name: <rule>` with an optional `pages: [...]` restriction and `reason:`.
#
# One entry per converter fixup, pinning the exact edits (see the compare.py docstring):
#   - id: <fixup-id>              # rule name becomes fixup:<fixup-id>
#     pages: [learn/example/]     # base-relative page paths
#     reason: why the difference is accepted
#     changes:
#       - {field: blocks, op: replace|insert|delete, index: N, from/to | value: ...}
#
rules:
  - name: placeholder-visible
    reason: >-
      Author placeholders such as <IS_HOME> or Map<String, String> are swallowed as unknown HTML by
      MkDocs and shown literally by Docusaurus (the text the author wrote).
  - name: ol-start
    reason: >-
      MkDocs restarts every ordered list at 1; Docusaurus keeps the number the author wrote.
  - name: list-not-paragraph
    reason: >-
      Lines the author wrote as a Markdown list that MkDocs rendered as a paragraph with literal
      list markers are now a real list (author intent), with identical text.
  - name: deprecated-banner-page-removed
    reason: >-
      includes/deprecated-banner.md is a snippet include, not a page; it is now the partial
      includes/_deprecated-banner.md and no longer published.
  - name: gfm-autolink-literal
    reason: >-
      remark-gfm links bare URLs and emails that MkDocs shows as plain text (Ruling 20); the text is
      unchanged.
  - name: onclick-card-link
    reason: >-
      MkDocs home cards navigate with onclick="location.href=..."; Docusaurus renders anchors with the
      same targets (inline event handlers are not allowed in MDX).
  - name: admonition-type-map
    reason: >-
      MkDocs shows unknown or missing admonition types (optional, example, empty, Note) with the default
      box; Docusaurus only has fixed types, so they map to note or info. Titles are identical.
  - name: list-restructure-text-preserved
    pages:
      - conformance/ciba-conformance/
      - develop/java/authentication-flow-for-data-publishing/
      - develop/java/jwt-access-tokens/
      - get-started/deploy-apis/
      - get-started/try-out-flow-with-is/
      - get-started/try-out-flow/
      - toolkits/regulatory-aggregator/regulatory-aggregator-try-out/
      - tryout-flows/accelerator-with-is-and-apim/try-out-accounts-flow-dcr/
      - tryout-flows/accelerator-with-is-and-apim/try-out-accounts-flow/
      - tryout-flows/accelerator-with-is-and-apim/try-out-payments-flow-dcr/
      - tryout-flows/accelerator-with-is-and-apim/try-out-payments-flow/
    reason: >-
      MkDocs folds nested lines into their parent item or flattens them; Docusaurus nests them as the
      author indented them (author intent). Only depth, item boundaries and start differ; the text of
      the lists is the same.
