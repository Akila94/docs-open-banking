# Allowlist of accepted MkDocs-vs-Docusaurus content differences (see compare.py).
#
# Every listed rule must explain at least one difference, otherwise compare.py fails
# (so the list cannot go stale). Built-in rule names:
#   placeholder-visible, ol-start, nested-list, list-not-paragraph,
#   admonition-title-markup, deprecated-banner-page-removed, gfm-autolink-literal
# Built-in entries: `- name: <rule>` with an optional `pages: [...]` restriction and `reason:`.
#
# One entry per converter fixup, pinning the exact change (all keys required):
#   - id: <fixup-id>              # rule name becomes fixup:<fixup-id>
#     pages: [learn/example/]     # base-relative page paths
#     field: blocks               # the one model field that changed
#     from: "old wording"         # Docusaurus value == MkDocs value with `from` replaced by `to` once
#     to: "new wording"
#     reason: why the difference is accepted
rules:
  - name: placeholder-visible
    reason: >-
      Author placeholders such as <IS_HOME> or Map<String, String> are swallowed as unknown HTML by
      MkDocs and shown literally by Docusaurus (the text the author wrote).
  - name: ol-start
    reason: >-
      MkDocs restarts every ordered list at 1; Docusaurus keeps the number the author wrote.
  - name: list-not-paragraph
    reason: >-
      Lines the author wrote as a Markdown list that MkDocs rendered as a paragraph with literal
      list markers are now a real list (author intent), with identical text.
  - name: deprecated-banner-page-removed
    reason: >-
      includes/deprecated-banner.md is a snippet include, not a page; it is now the partial
      includes/_deprecated-banner.md and no longer published.
  - name: gfm-autolink-literal
    reason: >-
      remark-gfm links bare URLs and emails that MkDocs shows as plain text (Ruling 20); the text is
      unchanged.
