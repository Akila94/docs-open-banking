name: Documentation PR Checks

on:
  pull_request:
    branches:
      - master
      - 3.0.0
      - versions

# Checks only read the repository. Nothing here needs a write token.
permissions:
  contents: read

jobs:
  build:
    name: Build and Check Documentation Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/migration/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The converter tests import tools/migration's own pinned devDependencies, which the root
      # install does not provide.
      - name: Install converter dependencies
        run: npm ci --prefix tools/migration

      - name: Security audit
        run: npm run audit

      # The converter is a dev-only tool but its tests run here, so audit its pinned tree too.
      - name: Security audit (converter)
        run: npm audit --prefix tools/migration --audit-level=high

      - name: Type check
        run: npm run typecheck

      # Converter, Redoc/linked-image plugin helper, version dropdown parser and link-check tests.
      # The Python verification harness is deliberately not run here: it needs the MkDocs oracle
      # build and is a local-only tool (tools/migration/verify/).
      - name: Run tests
        run: npm test

      # onBrokenLinks, onBrokenAnchors and onBrokenMarkdownLinks are 'warn' (pre-existing breakage
      # must survive the migration), so the build alone does not catch dead links.
      - name: Build documentation
        run: npm run build
        env:
          BASE_URL: /en/latest/

      # Fails on any NEW broken link, and on any baseline entry that is now fixed.
      - name: Check links against the baseline
        run: npm run check-links
